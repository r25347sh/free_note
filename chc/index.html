<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Casino - Live BGM Generator</title>
    <!-- Tone.js の読み込み -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5a880; /* シャンパンゴールド */
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(197, 168, 128, 0.5);
        }
        p { color: #8f8f8f; margin-bottom: 30px; }
        .btn {
            background: linear-gradient(135deg, #c5a880 0%, #a38558 100%);
            border: none;
            color: #0b0c10;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(197, 168, 128, 0.3);
            transition: all 0.3s ease;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 168, 128, 0.5);
        }
        .btn-stop { background: #333; color: #ccc; }
        #status { margin-top: 20px; font-size: 0.9rem; color: #ff5555; }
    </style>
</head>
<body>

    <h1>CLUB CASINO</h1>
    <p>Real-time Luxury Ambient Generator</p>
    
    <div>
        <button class="btn" id="start-btn">ENTER / PLAY</button>
        <button class="btn btn-stop" id="stop-btn">STOP</button>
    </div>
    <div id="status"></div>

    <script>
        // エラーハンドリング用
        const statusDiv = document.getElementById("status");

        // --- 1. エフェクト ---
        const reverb = new Tone.Reverb({ roomSize: 0.6, wet: 0.3 }).toDestination();

        // --- 2. 楽器の設定 ---
        const piano = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.03, decay: 0.1, sustain: 0.7, release: 0.8 }
        }).connect(reverb);
        piano.volume.value = -6;

        const bass = new Tone.MonoSynth({
            oscillator: { type: "triangle" },
            envelope: { attack: 0.05, decay: 0.2, sustain: 0.8, release: 0.4 }
        }).connect(reverb);
        bass.volume.value = -3;

        // --- 3. 音楽のルール（ホストカジノ風コード） ---
        const progression = [
            { chords: ["A3", "C4", "E4", "G4"], bass: "A2" },  // Am7
            { chords: ["D3", "F#4", "A4", "C5"], bass: "D2" }, // D7
            { chords: ["B3", "D4", "F#4", "A4"], bass: "B2" }, // Bm7
            { chords: ["E3", "G#4", "B4", "D5"], bass: "E2" }  // E7
        ];
        const melodyNotes = ["A4", "B4", "C5", "E5", "F#5", "G5", "A5", "C6"];

        let totalBeats = 0;

        // --- 4. 確実な再生ループ（4分音符ごと） ---
        Tone.Transport.scheduleRepeat((time) => {
            const currentMeasure = Math.floor(totalBeats / 4);
            const chordIndex = currentMeasure % progression.length;
            const currentProg = progression[chordIndex];
            const beatInMeasure = totalBeats % 4;

            // 1拍目の頭で和音とベースを鳴らす
            if (beatInMeasure === 0) {
                piano.triggerAttackRelease(currentProg.chords, "2n", time, 0.3);
                bass.triggerAttackRelease(currentProg.bass, "2n", time, 0.6);
            } 
            // 3拍目でベースを動かす
            else if (beatInMeasure === 2) {
                bass.triggerAttackRelease(currentProg.bass, "4n", time, 0.4);
            }

            // メロディをランダム生成
            if (Math.random() > 0.4) {
                const randomNote = melodyNotes[Math.floor(Math.random() * melodyNotes.length)];
                // 拍の裏（少し遅らせたタイミング）で鳴らす
                const delayTime = Math.random() > 0.5 ? Tone.Time("8n").toSeconds() : 0;
                piano.triggerAttackRelease(randomNote, "8n", time + delayTime, 0.2);
            }

            totalBeats++;
        }, "4n");

        Tone.Transport.bpm.value = 110;

        // --- 5. ボタンの制御 ---
        document.getElementById("start-btn").addEventListener("click", async () => {
            try {
                statusDiv.innerText = "起動中...";
                // オーディオコンテキストの明示的な開始
                await Tone.start();
                Tone.Transport.start();
                statusDiv.innerText = "再生中...（音が小さい場合は音量を上げてください）";
                statusDiv.style.color = "#c5a880";
            } catch (error) {
                statusDiv.innerText = "エラーが発生しました: " + error.message;
            }
        });

        document.getElementById("stop-btn").addEventListener("click", () => {
            Tone.Transport.stop();
            statusDiv.innerText = "停止中";
            statusDiv.style.color = "#8f8f8f";
        });
    </script>
</body>
</html>
