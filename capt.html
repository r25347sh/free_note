<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>超高解像度・ページ自動スクロール撮影ツール</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        /* レイアウト */
        #container { display: flex; flex-direction: column; height: 100vh; }
        
        /* 設定パネル */
        #control-panel { background: #2d2d2d; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group.url { flex: 1; min-width: 300px; }
        label { font-size: 12px; color: #ccc; font-weight: bold; }
        input { background: #444; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; font-size: 14px; }
        input:focus { outline: none; border-color: #007bff; }
        
        /* ボタン類 */
        button { padding: 8px 16px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; }
        #load-btn { background: #28a745; color: white; }
        #load-btn:hover { background: #218838; }
        #start-btn { background: #007bff; color: white; }
        #start-btn:hover { background: #0069d9; }
        button:disabled { background: #555 !important; color: #aaa; cursor: not-allowed; }
        
        #status { font-size: 13px; color: #ffc107; min-width: 150px; align-self: center; }

        /* ターゲットページを表示するエリア */
        #view-area { flex: 1; background: #fff; position: relative; }
        /* 4K（3840x2160）などの超高解像度を強制するコンテナ */
        #resolution-scaler {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            /* JSで動的に幅と高さを4K等に変えます */
        }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <div id="container">
        <!-- 上部設定パネル -->
        <div id="control-panel">
            <div class="input-group url">
                <label>撮影するGitHub PagesのURL:</label>
                <input type="url" id="page-url" value="" placeholder="https://github.io">
            </div>
            <button id="load-btn">ページ読み込み</button>
            
            <div class="input-group">
                <label>動画の長さ (秒):</label>
                <input type="number" id="duration" value="10" min="1" style="width: 80px;">
            </div>
            <div class="input-group">
                <label>終了位置 (px):</label>
                <input type="number" id="end-px" value="3000" min="0" style="width: 100px;">
            </div>
            <div class="input-group">
                <label>撮影解像度 (横幅):</label>
                <!-- 4K撮影時は3840を指定 -->
                <input type="number" id="capture-width" value="3840" min="1280" style="width: 90px;">
            </div>
            
            <button id="start-btn" disabled>録画＆スクロール開始</button>
            <div id="status">URLを入力して読み込んでください</div>
        </div>

        <!-- ページ表示エリア -->
        <div id="view-area">
            <div id="resolution-scaler">
                <iframe id="target-frame" src="about:blank"></div>
            </div>
        </div>
    </div>

    <script>
        const pageUrlInput = document.getElementById('page-url');
        const loadBtn = document.getElementById('load-btn');
        const startBtn = document.getElementById('start-btn');
        const durationInput = document.getElementById('duration');
        const endPxInput = document.getElementById('end-px');
        const widthInput = document.getElementById('capture-width');
        const status = document.getElementById('status');
        const iframe = document.getElementById('target-frame');
        const scaler = document.getElementById('resolution-scaler');
        const viewArea = document.getElementById('view-area');

        let targetWindow = null;

        // 1. ページをiframeに読み込む
        loadBtn.addEventListener('click', () => {
            const url = pageUrlInput.value.trim();
            if (!url) return alert('URLを入力してください');

            status.innerText = 'ページを読み込み中...（完了を待っています）';
            startBtn.disabled = true;
            
            // 解像度の設定（例: 4K=3840x2160）
            const targetWidth = parseInt(widthInput.value) || 3840;
            // 4Kの標準比率16:9で高さを計算
            const targetHeight = Math.round(targetWidth * (9 / 16)); 

            // iframeを超高解像度サイズに固定
            scaler.style.width = targetWidth + 'px';
            scaler.style.height = targetHeight + 'px';

            // 自分の画面に収まるように縮小表示（プレビュー用。実際の解像度は維持されます）
            const scale = viewArea.clientWidth / targetWidth;
            scaler.style.transform = `scale(${scale})`;

            // iframeのロード
            iframe.src = url;
        });

        // iframeの読み込みが「完全に終了」したらボタンを有効化
        iframe.onload = () => {
            if (iframe.src === 'about:blank') return;
            
            try {
                targetWindow = iframe.contentWindow;
                // テスト的にスクロール量を取得してみる（CORSエラーチェック）
                const docHeight = targetWindow.document.documentElement.scrollHeight;
                endPxInput.value = docHeight - targetWindow.innerHeight;
                
                status.innerText = '読み込み完了！録画可能です。';
                startBtn.disabled = false;
            } catch (e) {
                // ドメインが違う場合の警告
                status.innerText = '【注意】別ドメインのため制限あり';
                startBtn.disabled = false; 
                console.warn("CORS制限により、自動での高さ取得ができません。終了位置(px)を手動で入力してください。");
                alert("ツールと異なるドメインのサイトです。自動スクロールが動かない場合は、このツールファイルをGitHub Pagesの同じリポジトリ（同じドメイン内）にアップロードしてそこから開いてください。");
            }
        };

        // 2. 録画＆スクロール実行
        startBtn.addEventListener('click', async () => {
            const durationSec = parseFloat(durationInput.value);
            const endPx = parseInt(endPxInput.value);
            const targetWidth = parseInt(widthInput.value);
            const targetHeight = Math.round(targetWidth * (9 / 16));

            status.innerText = '画面共有で「このタブ」を選択してください...';

            try {
                // 超高解像度(4Kなど)・高フレームレート(60fps)のキャプチャ要求
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        displaySurface: "browser",
                        width: { ideal: targetWidth, max: targetWidth },
                        height: { ideal: targetHeight, max: targetHeight },
                        frameRate: { ideal: 60, max: 60 }
                    },
                    audio: false
                });

                // 最高画質ビットレート設定 (4K対応のため50Mbps = 50,000,000 bps)
                const recorder = new MediaRecorder(stream, { 
                    mimeType: 'video/webm; codecs=vp9',
                    videoBitsPerSecond: 50000000 
                });
                
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `scroll-4k-${Date.now()}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    status.innerText = '動画をダウンロードしました！';
                    document.getElementById('control-panel').style.display = 'flex';
                };

                // 録画中のコントロールパネルを非表示にする（動画への映り込み防止）
                document.getElementById('control-panel').style.display = 'none';

                recorder.start();

                const startTime = performance.now();
                const durationMs = durationSec * 1000;

                function step(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / durationMs, 1);
                    const currentPx = endPx * progress;

                    // iframeの中をスクロールさせる
                    if (targetWindow) {
                        targetWindow.scrollTo(0, currentPx);
                    }

                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        recorder.stop();
                        stream.getTracks().forEach(track => track.stop());
                    }
                }

                requestAnimationFrame(step);

            } catch (err) {
                console.error(err);
                alert("キャプチャに失敗しました。");
                document.getElementById('control-panel').style.display = 'flex';
                status.innerText = 'エラー発生';
            }
        });

        // ウィンドウサイズが変更されたらプレビューの縮小率を再計算
        window.onresize = () => {
            if(iframe.src !== 'about:blank'){
                const targetWidth = parseInt(widthInput.value) || 3840;
                const scale = viewArea.clientWidth / targetWidth;
                scaler.style.transform = `scale(${scale})`;
            }
        };
    </script>
</body>
</html>
