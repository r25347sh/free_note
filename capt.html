<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>5G Fest 専用・超高解像度スクロール撮影ツール</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        #container { display: flex; flex-direction: column; height: 100vh; }
        #control-panel { background: #2d2d2d; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group.url { flex: 1; min-width: 200px; }
        label { font-size: 12px; color: #ccc; font-weight: bold; }
        input { background: #444; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; font-size: 14px; }
        
        button { padding: 8px 16px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
        #load-btn { background: #28a745; color: white; }
        #start-btn { background: #007bff; color: white; }
        button:disabled { background: #555 !important; color: #aaa; cursor: not-allowed; }
        #status { font-size: 13px; color: #ffc107; min-width: 150px; align-self: center; }

        #view-area { flex: 1; background: #fff; position: relative; }
        #resolution-scaler { position: absolute; top: 0; left: 0; transform-origin: top left; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <div id="container">
        <div id="control-panel">
            <div class="input-group url">
                <label>撮影するファイル名（同じフォルダ内）:</label>
                <!-- 同じフォルダなので index.html と入れるだけでOKになります -->
                <input type="text" id="page-url" value="index.html" placeholder="index.html">
            </div>
            <button id="load-btn">ページ読み込み</button>
            
            <div class="input-group">
                <label>動画の長さ (秒):</label>
                <input type="number" id="duration" value="15" min="1" style="width: 60px;">
            </div>
            <div class="input-group">
                <label>終了位置 (px):</label>
                <input type="number" id="end-px" value="2000" min="0" style="width: 90px;">
            </div>
            <div class="input-group">
                <label>解像度 (横幅):</label>
                <input type="number" id="capture-width" value="3840" min="1280" style="width: 80px;">
            </div>
            
            <button id="start-btn" disabled>録画＆スクロール開始</button>
            <div id="status">「ページ読み込み」を押してください</div>
        </div>

        <div id="view-area">
            <div id="resolution-scaler">
                <iframe id="target-frame" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script>
        const pageUrlInput = document.getElementById('page-url');
        const loadBtn = document.getElementById('load-btn');
        const startBtn = document.getElementById('start-btn');
        const durationInput = document.getElementById('duration');
        const endPxInput = document.getElementById('end-px');
        const widthInput = document.getElementById('capture-width');
        const status = document.getElementById('status');
        const iframe = document.getElementById('target-frame');
        const scaler = document.getElementById('resolution-scaler');
        const viewArea = document.getElementById('view-area');

        let targetWindow = null;

        loadBtn.addEventListener('click', () => {
            const url = pageUrlInput.value.trim();
            if (!url) return alert('ファイル名を入力してください');

            status.innerText = '完全に読み込みが終わるまでお待ちください...';
            startBtn.disabled = true;
            
            const targetWidth = parseInt(widthInput.value) || 3840;
            const targetHeight = Math.round(targetWidth * (9 / 16)); 

            scaler.style.width = targetWidth + 'px';
            scaler.style.height = targetHeight + 'px';

            const scale = viewArea.clientWidth / targetWidth;
            scaler.style.transform = `scale(${scale})`;

            // iframeに読み込む
            iframe.src = url;
        });

        // 完全に読み込みが終わったら実行されるイベント
        iframe.onload = () => {
            if (iframe.src === 'about:blank') return;
            
            try {
                targetWindow = iframe.contentWindow;
                
                // 完全に読み込みが終わったあとの高さを取得して、スクロール終了位置に自動セット
                setTimeout(() => {
                    const docHeight = targetWindow.document.documentElement.scrollHeight;
                    const viewHeight = targetWindow.innerHeight;
                    endPxInput.value = Math.max(0, docHeight - viewHeight);
                    
                    status.innerText = '読み込み完全完了！録画できます。';
                    startBtn.disabled = false;
                }, 1000); // 画像のレンダリング安定のために1秒だけ安全マージン

            } catch (e) {
                status.innerText = '読み込みエラー（配置場所が違います）';
                console.error(e);
            }
        };

        startBtn.addEventListener('click', async () => {
            const durationSec = parseFloat(durationInput.value);
            const endPx = parseInt(endPxInput.value);
            const targetWidth = parseInt(widthInput.value);
            const targetHeight = Math.round(targetWidth * (9 / 16));

            status.innerText = '画面共有で「このタブ」を選択してください';

            try {
                // 4K（3840x2160） / 60fps の超高解像度設定
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        displaySurface: "browser",
                        width: { ideal: targetWidth, max: targetWidth },
                        height: { ideal: targetHeight, max: targetHeight },
                        frameRate: { ideal: 60, max: 60 }
                    },
                    audio: false
                });

                // 4K用の超高ビットレート（50Mbps）
                const recorder = new MediaRecorder(stream, { 
                    mimeType: 'video/webm; codecs=vp9',
                    videoBitsPerSecond: 50000000 
                });
                
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `5g-fest-4k-scroll.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    status.innerText = '保存完了！';
                    document.getElementById('control-panel').style.display = 'flex';
                };

                // コントロールパネルを隠して動画に映らないようにする
                document.getElementById('control-panel').style.display = 'none';

                if (targetWindow) targetWindow.scrollTo(0, 0);
                recorder.start();

                const startTime = performance.now();
                const durationMs = durationSec * 1000;

                function step(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / durationMs, 1);
                    const currentPx = endPx * progress;

                    if (targetWindow) {
                        targetWindow.scrollTo(0, currentPx);
                    }

                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        recorder.stop();
                        stream.getTracks().forEach(track => track.stop());
                    }
                }

                requestAnimationFrame(step);

            } catch (err) {
                alert("キャンセルされたか、エラーが起きました。");
                document.getElementById('control-panel').style.display = 'flex';
                status.innerText = '待機中';
            }
        });

        window.onresize = () => {
            if(iframe.src !== 'about:blank'){
                const targetWidth = parseInt(widthInput.value) || 3840;
                const scale = viewArea.clientWidth / targetWidth;
                scaler.style.transform = `scale(${scale})`;
            }
        };
    </script>
</body>
</html>
