<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音声パススルー（入力→そのまま出力）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      background: #0f1115;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .sub {
      color: #9aa0a6;
      font-size: 0.9rem;
      margin-bottom: 32px;
      text-align: center;
      line-height: 1.5;
    }
    .card {
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 28px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #5f6368;
      flex-shrink: 0;
    }
    .dot.on {
      background: #34a853;
      box-shadow: 0 0 10px #34a853;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .dot.error {
      background: #ea4335;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    button {
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    #startBtn {
      background: #1a73e8;
      color: #fff;
    }
    #startBtn:hover {
      background: #1765cc;
    }
    #startBtn:disabled {
      background: #3c4043;
      color: #9aa0a6;
      cursor: not-allowed;
    }
    #stopBtn {
      background: #3c4043;
      color: #e8eaed;
      margin-top: 10px;
      display: none;
    }
    #stopBtn:hover {
      background: #5f6368;
    }
    .meter-wrap {
      margin-top: 24px;
      display: none;
    }
    .meter-label {
      font-size: 0.8rem;
      color: #9aa0a6;
      margin-bottom: 6px;
    }
    .meter {
      height: 8px;
      background: #2a2f3a;
      border-radius: 4px;
      overflow: hidden;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #34a853, #fbbc04, #ea4335);
      border-radius: 4px;
      transition: width 0.05s linear;
    }
    .note {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #9aa0a6;
      line-height: 1.6;
      text-align: left;
    }
    .note strong {
      color: #e8eaed;
    }
  </style>
</head>
<body>
  <h1>音声パススルー</h1>
  <p class="sub">マイク入力をそのままスピーカーへ出力します<br>（有線スピーカー接続想定）</p>

  <div class="card">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">待機中</span>
    </div>

    <button id="startBtn">開始する</button>
    <button id="stopBtn">停止する</button>

    <div class="meter-wrap" id="meterWrap">
      <div class="meter-label">入力レベル</div>
      <div class="meter">
        <div class="meter-bar" id="meterBar"></div>
      </div>
    </div>
  </div>

  <p class="note">
    <strong>使い方</strong><br>
    1. 「開始する」を押してマイク許可を出す<br>
    2. PCのスピーカー出力を有線スピーカーに接続<br>
    3. マイクに入った音がそのままスピーカーから出ます<br><br>
    ※ ハウリング防止のため、マイクとスピーカーを近づけすぎないでください。<br>
    ※ ブラウザのタブを閉じるか「停止する」で終了します。
  </p>

  <script>
    let audioContext = null;
    let sourceNode = null;
    let analyser = null;
    let stream = null;
    let animId = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');
    const meterWrap = document.getElementById('meterWrap');
    const meterBar = document.getElementById('meterBar');

    function setStatus(text, state) {
      statusText.textContent = text;
      dot.className = 'dot' + (state === 'on' ? ' on' : state === 'error' ? ' error' : '');
    }

    async function start() {
      startBtn.disabled = true;
      setStatus('マイク許可を待っています…', '');

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          },
          video: false
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        sourceNode = audioContext.createMediaStreamSource(stream);

        // アナライザー（レベルメーター用）
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        sourceNode.connect(analyser);

        // そのまま出力へ接続（パススルー）
        sourceNode.connect(audioContext.destination);

        setStatus('パススルー中', 'on');
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        meterWrap.style.display = 'block';

        // レベルメーター更新
        const data = new Uint8Array(analyser.frequencyBinCount);
        function updateMeter() {
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / data.length;
          const pct = Math.min(100, (avg / 128) * 100);
          meterBar.style.width = pct + '%';
          animId = requestAnimationFrame(updateMeter);
        }
        updateMeter();

      } catch (err) {
        console.error(err);
        setStatus('エラー: ' + (err.message || 'マイクにアクセスできません'), 'error');
        startBtn.disabled = false;
      }
    }

    function stop() {
      if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
      }
      if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
      }
      if (analyser) {
        analyser.disconnect();
        analyser = null;
      }
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      meterBar.style.width = '0%';
      meterWrap.style.display = 'none';
      stopBtn.style.display = 'none';
      startBtn.style.display = 'block';
      startBtn.disabled = false;
      setStatus('待機中', '');
    }

    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);

    // タブを閉じたときなど
    window.addEventListener('beforeunload', stop);
  </script>
</body>
</html>
