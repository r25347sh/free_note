<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizAI v4 — Groq / OpenRouter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-mark">Q</span>
        <span class="logo-text">QuizAI</span>
        <span class="badge-light">v4</span>
      </div>
      <div class="header-status" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <main class="main">
      <section class="panel control-panel">
        <h2 class="panel-title">Control</h2>

        <div class="control-group">
          <label class="label">Provider（無料）</label>
          <select id="provider" class="select">
            <option value="groq" selected>Groq（推奨・高速 Vision）</option>
            <option value="openrouter">OpenRouter（free モデル）</option>
          </select>
        </div>

        <div class="control-group">
          <label class="label">API Key</label>
          <input
            id="apiKey"
            class="select"
            type="password"
            placeholder="gsk_… or sk-or-…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="btn-row">
          <button id="btnSaveKey" class="btn btn-primary" type="button">Save Key</button>
          <button id="btnStartShare" class="btn btn-secondary" type="button" disabled>Start Screen Share</button>
        </div>

        <div class="progress-wrap" id="progressWrap" hidden>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <p class="progress-text" id="progressText">…</p>
        </div>

        <div class="btn-row mt">
          <button id="btnSolve" class="btn btn-accent" type="button" disabled>解答生成 (Solve)</button>
          <button id="btnStopShare" class="btn btn-ghost" type="button" disabled>Stop Share</button>
        </div>

        <p class="hint">
          <strong>v4</strong>：Gemini 不可の場合用。<br /><br />
          <strong>Groq</strong>（推奨）<br />
          キー: <a href="https://console.groq.com/keys" target="_blank" rel="noopener" style="color:#5b8def">console.groq.com/keys</a><br />
          無料・クレカ不要・Vision対応・高速<br /><br />
          <strong>OpenRouter</strong><br />
          キー: <a href="https://openrouter.ai/keys" target="_blank" rel="noopener" style="color:#5b8def">openrouter.ai/keys</a><br />
          free モデル 約50回/日
        </p>
      </section>

      <section class="panel preview-panel">
        <h2 class="panel-title">Screen Preview</h2>
        <div class="video-container">
          <video id="previewVideo" autoplay playsinline muted></video>
          <canvas id="captureCanvas" hidden></canvas>
          <div class="video-placeholder" id="videoPlaceholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <path d="M8 21h8M12 17v4" />
            </svg>
            <p>画面共有を開始</p>
          </div>
        </div>
      </section>

      <section class="panel answer-panel">
        <h2 class="panel-title">Answer</h2>
        <div class="answer-box" id="answerBox">
          <p class="answer-placeholder">正解のみ表示</p>
        </div>
        <div class="meta" id="metaInfo"></div>
      </section>
    </main>

    <footer class="footer">
      <span>Screen Capture API · Groq / OpenRouter · key stays in browser</span>
    </footer>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
